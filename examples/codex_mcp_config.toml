# Bunu kullanıcı config.toml dosyanıza ekleyin. Token'ı dosyaya yazmayın.

[mcp_servers.research_platform]
enabled = true
required = false
url = "http://RESEARCH_SERVER_IP:8010/mcp"
bearer_token_env_var = "RESEARCH_MCP_TOKEN"
startup_timeout_sec = 20.0
tool_timeout_sec = 3600.0
