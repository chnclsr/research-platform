name: research-platform

x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://research:research@postgres:5432/research}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
    AGENTSEARCH_URL: ${AGENTSEARCH_URL:-http://agentsearch-adapter:3940}
    CRAWL4AI_URL: ${CRAWL4AI_URL:-http://crawl4ai:11235}
    OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    # The heavy half of PDF parsing. Empty disables it: the router still routes, the
    # pages it routes keep their fast-path text and the document is marked degraded.
    SMART_ROUTER_DOCLING_URL: ${SMART_ROUTER_DOCLING_URL:-http://docling:3941}
    # CPU budgets. docker-compose.gpu.yml lowers both on the worker, because a GPU
    # deployment is ~3x faster per page and does not need the slack. Measured
    # 2026-08-21: 138 routed pages over 12 documents, 671 s bridged on CPU. At the old
    # 300 s queue wait the tail of that queue never got a slot.
    SMART_ROUTER_QUEUE_WAIT_S: ${SMART_ROUTER_QUEUE_WAIT_S:-900}
    SMART_ROUTER_HEAVY_TIMEOUT_S: ${SMART_ROUTER_HEAVY_TIMEOUT_S:-1800}
    # Identity settings. SERVICE_TOKEN is what the panel and the bot present when they
    # act for a user; SESSION_SECRET keeps panel logins alive across a restart.
    SERVICE_TOKEN: ${SERVICE_TOKEN:-}
    SESSION_SECRET: ${SESSION_SECRET:-}
    CORPUS_SCOPE: ${CORPUS_SCOPE:-owner}
    TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
  restart: unless-stopped
  networks: [research]

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: research
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [research]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [research]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-research}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me-now}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      # Raw snapshots and export artifacts are the only unbounded-growth data here. A host
      # path keeps them out of the Docker disk image, which never shrinks once grown, and
      # lets a deployment point them at a larger disk.
      - ${MINIO_DATA_DIR:-./data/minio}:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [research]

  crawl4ai:
    image: unclecode/crawl4ai:0.9.1
    shm_size: 1gb
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-local-crawl-token}
      SECRET_KEY: ${CRAWL4AI_SECRET_KEY:-change-me-crawl-secret-at-least-32-chars}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=1g
      - /home/appuser/.crawl4ai:uid=999,gid=999,mode=0700,size=2g
      - /home/appuser/.gunicorn:uid=999,gid=999,mode=0700,size=64m
    ports:
      - "127.0.0.1:11235:11235"
    volumes:
      - crawl4ai-browser-cache:/home/appuser/.cache/ms-playwright
    networks: [research]
    restart: unless-stopped

  # Fronts a plain SearXNG instance (run outside this compose project, default
  # port 3939) with the /search, /read and /health contract the AgentSearch
  # connectors expect. Point SEARXNG_URL at a real AgentSearch service instead
  # and this service can be dropped.
  agentsearch-adapter:
    build: .
    command: ["python", "/app/agentsearch_adapter.py"]
    environment:
      SEARXNG_URL: ${SEARXNG_URL:-http://host.docker.internal:3939}
      ADAPTER_PORT: 3940
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./scripts/agentsearch_adapter.py:/app/agentsearch_adapter.py:ro
    ports:
      - "127.0.0.1:3940:3940"
    networks: [research]
    restart: unless-stopped

  # The heavy half of smart_pdf: Docling, kept resident so the models are loaded once
  # rather than per document (measured 2026-08-21: ~24 s of every document's cost).
  #
  # DEFAULTS TO CPU AND IS NOT BEHIND A PROFILE. A profile would repeat the
  # telegram-bot trap -- a plain `docker compose up -d --build` would leave this
  # service on an old image and say nothing. CPU works on every machine; a box with an
  # NVIDIA card adds docker-compose.gpu.yml, which is what turns this into a CUDA
  # build. Do not "fix" a CPU deployment by setting DOCLING_DEVICE=cuda here: the
  # service refuses to start without a card on purpose, because CPU and GPU do not
  # produce the same text and a silent fallback would rewrite content_hash.
  docling:
    build:
      context: .
      dockerfile: Dockerfile.docling
      args:
        TORCH_VARIANT: ${TORCH_VARIANT:-cpu}
    environment:
      DOCLING_DEVICE: ${DOCLING_DEVICE:-cpu}
      DOCLING_PORT: 3941
      # One conversion at a time. On GPU this is what protects the VRAM the run
      # planner has reserved for Ollama (see capacity._gpu_slots).
      DOCLING_MAX_CONCURRENT: ${DOCLING_MAX_CONCURRENT:-1}
      DOCLING_NUM_THREADS: ${DOCLING_NUM_THREADS:-4}
    ports:
      - "127.0.0.1:3941:3941"
    healthcheck:
      # No curl in python:3.12-slim, and adding it would be an apt layer for one probe.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:3941/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      # Models load before the port opens, so the first probe must not be the one that
      # declares the service dead.
      start_period: 300s
    networks: [research]
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    command: ["research-api"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://research:research@postgres:5432/research}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      AGENTSEARCH_URL: ${AGENTSEARCH_URL:-http://agentsearch-adapter:3940}
      CRAWL4AI_URL: ${CRAWL4AI_URL:-http://crawl4ai:11235}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      # /health reports the service and the device it answered on.
      SMART_ROUTER_DOCLING_URL: ${SMART_ROUTER_DOCLING_URL:-http://docling:3941}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      CORPUS_SCOPE: ${CORPUS_SCOPE:-owner}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app
    command: ["research-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  langflow:
    image: langflowai/langflow:1.5.1
    environment:
      LANGFLOW_HOST: 0.0.0.0
      LANGFLOW_COMPONENTS_PATH: /app/custom_components
      RESEARCH_API_URL: http://api:8000
      RESEARCH_API_TOKEN: ${API_TOKEN:-change-me-local-token}
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - ./langflow_components:/app/custom_components:ro
      - langflow-data:/app/langflow
    depends_on:
      - api
    networks: [research]
    restart: unless-stopped

  mcp-gateway:
    <<: *app
    command: ["research-mcp"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://research:research@postgres:5432/research}
      RESEARCH_API_URL: http://api:8000
      API_TOKEN: ${API_TOKEN:-change-me-local-token}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      CORPUS_SCOPE: ${CORPUS_SCOPE:-owner}
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8010
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-[]}
      MCP_ALLOWED_NETWORKS: ${MCP_ALLOWED_NETWORKS:-[]}
      GATEWAY_DOWNLOAD_DIR: /data/deliveries
    ports:
      # Published to the LAN again. It was pinned to loopback because an agent gateway
      # holding a single shared bearer token sat on the local network; that token is gone
      # and each caller now presents their own API key, so the reason expired with it.
      # The effective network gate is the Windows Firewall rule -- see OFFICE_TEAM_SETUP.
      - "${MCP_BIND_HOST:-0.0.0.0}:8010:8010"
    volumes:
      - gateway-deliveries:/data/deliveries
    depends_on:
      - api
    networks: [research]
    restart: unless-stopped

  telegram-bot:
    <<: *app
    command: ["research-telegram"]
    profiles: ["telegram"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://research:research@postgres:5432/research}
      RESEARCH_API_URL: http://api:8000
      API_TOKEN: ${API_TOKEN:-change-me-local-token}
      # The bot resolves a Telegram account to a platform user and then acts for that
      # user against the API, which requires the service credential.
      SERVICE_TOKEN: ${SERVICE_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-[]}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-[]}
      GATEWAY_DOWNLOAD_DIR: /data/deliveries
    volumes:
      - gateway-deliveries:/data/deliveries
    depends_on:
      - api
    networks: [research]
    restart: unless-stopped

networks:
  research:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  langflow-data:
  crawl4ai-browser-cache:
  gateway-deliveries:
