title: 'Showcase 3 — Humanoid Robots in Production: Evidence versus Expectations (English
  A/B)'
primary_question: Investigate real-world use of humanoid robots in automotive manufacturing,
  logistics, and general production from 1 January 2024 through 30 July 2026. Distinguish
  pilot announcements and demonstrations from verified production integration. Examine
  vision-language-action models, teleoperation, sim-to-real transfer, task success
  rate, cycle time, payload, safety, failures, comparison with human workers, and
  economic viability on a source-by-source basis. Verify claims by Figure, Agility
  Robotics, Apptronik, Tesla, 1X, and similar companies using independent reporting,
  academic studies, partners, customers, or official records. Include relevant open-source
  code, datasets, and benchmarks. Produce a visual, auditable Word report that clearly
  separates hype from verified evidence, includes counterevidence, and uses useful
  source figures with model interpretation.
research_mode: literature_scan
