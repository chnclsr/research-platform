title: 'Showcase 1 — Multimodal AI in Radiology: Clinical Evidence 2024–2026 (English
  A/B)'
primary_question: Conduct as comprehensive a literature and evidence search as possible
  for clinical evidence published from 1 January 2024 through 30 July 2026 on multimodal
  vision-language models and foundation models used in radiology. Compare studies
  by imaging modality, clinical task, dataset, cohort size, external validation, prospective
  versus retrospective design, comparison with radiologists, performance metrics,
  failure modes, bias, safety, and regulatory maturity. Separate reviews from original
  studies. Audit company and model claims against independent academic or official
  evidence, and present supporting and conflicting findings together. In the auditable
  Word report, include paper figures that materially help explain the findings, preserving
  the source, page, original caption, and the model's interpretation.
research_mode: literature_scan
