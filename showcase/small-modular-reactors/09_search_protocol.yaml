title: 'Showcase 2 — Small Modular Reactors: Cost, Schedule and Regulation (English
  A/B)'
primary_question: Conduct a comparative evidence review of small modular reactor (SMR)
  projects in the United States, Canada, the United Kingdom, and Europe from 1 January
  2023 through 30 July 2026. Compare project cost, construction schedule, licensing,
  financing, supply chain, and commercial maturity. Search academic research as well
  as energy ministries, nuclear regulators, project companies, and independent cost
  analyses. Do not treat CAPEX, cost per kW, LCOE, and commissioning dates as directly
  comparable without preserving nominal versus real prices, FOAK versus NOAK assumptions,
  and forecast versus realized values. Deliberately search for cancellations, delays,
  failed projects, and evidence that challenges company claims. Synthesize the findings
  into an auditable Word report with comparison tables and source figures where they
  materially clarify the evidence.
research_mode: literature_scan
