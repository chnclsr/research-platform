<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="418" viewBox="0 0 1000 418" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline düğümleri ve ThreadPool referansı medyan duvar süreleri</title>
  <desc id="desc">_search_node ve _acquire_node düğümlerinin c=1, c=2 ve c=4 medyan süreleri ile aynı iş yükünün bloklayan senkron ThreadPool referansı. Düşük süre daha iyidir.</desc>
  <rect width="1000" height="418" fill="#ffffff"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Gerçek pipeline düğümleri ve ThreadPool referansı</text>
  <text x="40" y="68" font-family="Arial, sans-serif" font-size="14" fill="#556070">8 kontrollü I/O işi, 5 tekrar · düşük değer daha iyi</text>
  <rect x="756" y="35" width="16" height="16" rx="3" fill="#0f9d58"/>
  <text x="780" y="48" font-family="Arial, sans-serif" font-size="14" fill="#172033">ThreadPool referansı</text>
  <rect x="604" y="35" width="16" height="16" rx="3" fill="#f97316"/>
  <text x="628" y="48" font-family="Arial, sans-serif" font-size="14" fill="#172033">İndirme düğümü</text>
  <rect x="468" y="35" width="16" height="16" rx="3" fill="#2563eb"/>
  <text x="492" y="48" font-family="Arial, sans-serif" font-size="14" fill="#172033">Arama düğümü</text>
  <g stroke="#d7dde7" stroke-width="1">
    <line x1="170.0" y1="90" x2="170.0" y2="338"/>
    <line x1="362.5" y1="90" x2="362.5" y2="338"/>
    <line x1="555.0" y1="90" x2="555.0" y2="338"/>
    <line x1="747.5" y1="90" x2="747.5" y2="338"/>
    <line x1="940.0" y1="90" x2="940.0" y2="338"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#667085" text-anchor="middle">
    <text x="170.0" y="361">0 ms</text>
    <text x="362.5" y="361">250</text>
    <text x="555.0" y="361">500</text>
    <text x="747.5" y="361">750</text>
    <text x="940.0" y="361">1000</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#172033" text-anchor="end">
    <text x="150" y="135.0">c=1 (referans: serial)</text>
    <text x="150" y="219.0">c=2 (referans: worker=2)</text>
    <text x="150" y="303.0">c=4 (referans: worker=4)</text>
  </g>
  <g fill="#2563eb">
    <rect x="170" y="100" width="627.7" height="20" rx="4"/>
    <rect x="170" y="184" width="354.5" height="20" rx="4"/>
    <rect x="170" y="268" width="203.8" height="20" rx="4"/>
  </g>
  <g fill="#f97316">
    <rect x="170" y="120" width="629.8" height="20" rx="4"/>
    <rect x="170" y="204" width="351.6" height="20" rx="4"/>
    <rect x="170" y="288" width="203.9" height="20" rx="4"/>
  </g>
  <g fill="#0f9d58">
    <rect x="170" y="140" width="587.9" height="20" rx="4"/>
    <rect x="170" y="224" width="326.0" height="20" rx="4"/>
    <rect x="170" y="308" width="194.8" height="20" rx="4"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#172033">
    <text x="805.7" y="115">815 ms</text>
    <text x="532.5" y="199">460 ms</text>
    <text x="381.8" y="283">265 ms</text>
    <text x="807.8" y="135">818 ms</text>
    <text x="529.6" y="219">457 ms</text>
    <text x="381.9" y="303">265 ms</text>
    <text x="765.9" y="155">764 ms</text>
    <text x="504.0" y="239">423 ms</text>
    <text x="372.8" y="323">253 ms</text>
  </g>
  <text x="40" y="400" font-family="Arial, sans-serif" font-size="12" fill="#667085">ThreadPool referansı bloklayan senkron I/O içindir; üretim bağlayıcıları async'tir ve ThreadPoolExecutor içinde çalıştırılmaz.</text>
</svg>
