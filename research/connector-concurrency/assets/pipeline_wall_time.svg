<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline düğümleri ve ThreadPool referansı medyan duvar süreleri</title>
  <desc id="desc">_search_node ve _acquire_node düğümlerinin c=1, c=2 ve c=4 medyan süreleri ile aynı iş yükünün bloklayan senkron ThreadPool referansı. Düşük süre daha iyidir.</desc>
  <rect width="1000" height="480" fill="#ffffff"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Gerçek pipeline düğümleri ve ThreadPool referansı</text>
  <text x="40" y="68" font-family="Arial, sans-serif" font-size="14" fill="#556070">8 kontrollü I/O işi, 5 tekrar · düşük değer daha iyi</text>
  <rect x="40.0" y="92" width="16" height="16" rx="3" fill="#2563eb"/>
  <text x="64.0" y="105" font-family="Arial, sans-serif" font-size="14" fill="#172033">Arama düğümü</text>
  <rect x="186.1" y="92" width="16" height="16" rx="3" fill="#f97316"/>
  <text x="210.1" y="105" font-family="Arial, sans-serif" font-size="14" fill="#172033">İndirme düğümü</text>
  <rect x="347.8" y="92" width="16" height="16" rx="3" fill="#0f9d58"/>
  <text x="371.8" y="105" font-family="Arial, sans-serif" font-size="14" fill="#172033">ThreadPool referansı</text>
  <g stroke="#d7dde7" stroke-width="1">
    <line x1="261.6" y1="120" x2="261.6" y2="400"/>
    <line x1="423.4" y1="120" x2="423.4" y2="400"/>
    <line x1="585.2" y1="120" x2="585.2" y2="400"/>
    <line x1="747.0" y1="120" x2="747.0" y2="400"/>
    <line x1="908.8" y1="120" x2="908.8" y2="400"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#667085" text-anchor="middle">
    <text x="261.6" y="423">0 ms</text>
    <text x="423.4" y="423">250</text>
    <text x="585.2" y="423">500</text>
    <text x="747.0" y="423">750</text>
    <text x="908.8" y="423">1000</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#172033" text-anchor="end">
    <text x="241.6" y="169.0">c=1 (referans: serial)</text>
    <text x="241.6" y="263.0">c=2 (referans: worker=2)</text>
    <text x="241.6" y="357.0">c=4 (referans: worker=4)</text>
  </g>
  <g fill="#2563eb">
    <rect x="261.6" y="130" width="527.6" height="20" rx="4"/>
    <rect x="261.6" y="224" width="297.9" height="20" rx="4"/>
    <rect x="261.6" y="318" width="171.3" height="20" rx="4"/>
  </g>
  <g fill="#f97316">
    <rect x="261.6" y="154" width="529.4" height="20" rx="4"/>
    <rect x="261.6" y="248" width="295.5" height="20" rx="4"/>
    <rect x="261.6" y="342" width="171.4" height="20" rx="4"/>
  </g>
  <g fill="#0f9d58">
    <rect x="261.6" y="178" width="494.2" height="20" rx="4"/>
    <rect x="261.6" y="272" width="274.0" height="20" rx="4"/>
    <rect x="261.6" y="366" width="163.8" height="20" rx="4"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#172033">
    <text x="797.2" y="145">815 ms</text>
    <text x="567.5" y="239">460 ms</text>
    <text x="440.9" y="333">265 ms</text>
    <text x="799.0" y="169">818 ms</text>
    <text x="565.1" y="263">457 ms</text>
    <text x="441.0" y="357">265 ms</text>
    <text x="763.8" y="193">764 ms</text>
    <text x="543.6" y="287">423 ms</text>
    <text x="433.4" y="381">253 ms</text>
  </g>
  <text x="40" y="462" font-family="Arial, sans-serif" font-size="12" fill="#667085">ThreadPool referansı bloklayan senkron I/O içindir; üretim bağlayıcıları async'tir ve ThreadPoolExecutor içinde çalıştırılmaz.</text>
</svg>
