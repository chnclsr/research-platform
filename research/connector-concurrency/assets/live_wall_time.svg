<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="422" viewBox="0 0 1000 422" role="img" aria-labelledby="title desc">
  <title id="title">Canlı ağ deneyi medyan duvar süreleri</title>
  <desc id="desc">Dört gerçek kaynak için arama ve indirme medyan sürelerinin concurrency seviyelerine göre karşılaştırması. Düşük süre daha iyidir.</desc>
  <rect width="1000" height="422" fill="#ffffff"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Canlı ağ deneyi: medyan duvar süresi</text>
  <text x="40" y="68" font-family="Arial, sans-serif" font-size="14" fill="#556070">4 gerçek kaynak, 5 tekrar · düşük değer daha iyi</text>
  <rect x="860" y="35" width="16" height="16" rx="3" fill="#f97316"/>
  <text x="884" y="48" font-family="Arial, sans-serif" font-size="14" fill="#172033">İndirme</text>
  <rect x="780" y="35" width="16" height="16" rx="3" fill="#2563eb"/>
  <text x="804" y="48" font-family="Arial, sans-serif" font-size="14" fill="#172033">Arama</text>
  <g stroke="#d7dde7" stroke-width="1">
    <line x1="170.0" y1="90" x2="170.0" y2="342"/>
    <line x1="362.5" y1="90" x2="362.5" y2="342"/>
    <line x1="555.0" y1="90" x2="555.0" y2="342"/>
    <line x1="747.5" y1="90" x2="747.5" y2="342"/>
    <line x1="940.0" y1="90" x2="940.0" y2="342"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#667085" text-anchor="middle">
    <text x="170.0" y="365">0 ms</text>
    <text x="362.5" y="365">500</text>
    <text x="555.0" y="365">1000</text>
    <text x="747.5" y="365">1500</text>
    <text x="940.0" y="365">2000</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#172033" text-anchor="end">
    <text x="150" y="125.0">Sıralı</text>
    <text x="150" y="189.0">asyncio c=1</text>
    <text x="150" y="253.0">asyncio c=2</text>
    <text x="150" y="317.0">asyncio c=4</text>
  </g>
  <g fill="#2563eb">
    <rect x="170" y="100" width="759.5" height="20" rx="4"/>
    <rect x="170" y="164" width="736.4" height="20" rx="4"/>
    <rect x="170" y="228" width="469.4" height="20" rx="4"/>
    <rect x="170" y="292" width="339.2" height="20" rx="4"/>
  </g>
  <g fill="#f97316">
    <rect x="170" y="120" width="443.8" height="20" rx="4"/>
    <rect x="170" y="184" width="449.6" height="20" rx="4"/>
    <rect x="170" y="248" width="298.9" height="20" rx="4"/>
    <rect x="170" y="312" width="264.6" height="20" rx="4"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#172033">
    <text x="937.5" y="115">1973 ms</text>
    <text x="914.4" y="179">1913 ms</text>
    <text x="647.4" y="243">1219 ms</text>
    <text x="517.2" y="307">881 ms</text>
    <text x="621.8" y="135">1153 ms</text>
    <text x="627.6" y="199">1168 ms</text>
    <text x="476.9" y="263">776 ms</text>
    <text x="442.6" y="327">687 ms</text>
  </g>
  <text x="40" y="404" font-family="Arial, sans-serif" font-size="12" fill="#667085">Not: Canlı ağda tekil koşular sağlayıcı gecikmesi nedeniyle değişebilir; sütunlar 5 koşunun medyanıdır.</text>
</svg>
