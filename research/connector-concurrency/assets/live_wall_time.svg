<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="478" viewBox="0 0 1000 478" role="img" aria-labelledby="title desc">
  <title id="title">Canlı ağ deneyi medyan duvar süreleri</title>
  <desc id="desc">Dört gerçek kaynak için arama ve indirme medyan sürelerinin concurrency seviyelerine göre karşılaştırması. Düşük süre daha iyidir.</desc>
  <rect width="1000" height="478" fill="#ffffff"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Canlı ağ deneyi: medyan duvar süresi</text>
  <text x="40" y="68" font-family="Arial, sans-serif" font-size="14" fill="#556070">4 gerçek kaynak, 5 tekrar · düşük değer daha iyi</text>
  <rect x="40.0" y="92" width="16" height="16" rx="3" fill="#2563eb"/>
  <text x="64.0" y="105" font-family="Arial, sans-serif" font-size="14" fill="#172033">Arama</text>
  <rect x="131.2" y="92" width="16" height="16" rx="3" fill="#f97316"/>
  <text x="155.2" y="105" font-family="Arial, sans-serif" font-size="14" fill="#172033">İndirme</text>
  <g stroke="#d7dde7" stroke-width="1">
    <line x1="152.4" y1="120" x2="152.4" y2="398"/>
    <line x1="339.7" y1="120" x2="339.7" y2="398"/>
    <line x1="527.0" y1="120" x2="527.0" y2="398"/>
    <line x1="714.3" y1="120" x2="714.3" y2="398"/>
    <line x1="901.6" y1="120" x2="901.6" y2="398"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#667085" text-anchor="middle">
    <text x="152.4" y="421">0 ms</text>
    <text x="339.7" y="421">500</text>
    <text x="527.0" y="421">1000</text>
    <text x="714.3" y="421">1500</text>
    <text x="901.6" y="421">2000</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#172033" text-anchor="end">
    <text x="132.4" y="157.0">Sıralı</text>
    <text x="132.4" y="227.0">asyncio c=1</text>
    <text x="132.4" y="297.0">asyncio c=2</text>
    <text x="132.4" y="367.0">asyncio c=4</text>
  </g>
  <g fill="#2563eb">
    <rect x="152.4" y="130" width="739.0" height="20" rx="4"/>
    <rect x="152.4" y="200" width="716.5" height="20" rx="4"/>
    <rect x="152.4" y="270" width="456.7" height="20" rx="4"/>
    <rect x="152.4" y="340" width="330.0" height="20" rx="4"/>
  </g>
  <g fill="#f97316">
    <rect x="152.4" y="154" width="431.8" height="20" rx="4"/>
    <rect x="152.4" y="224" width="437.4" height="20" rx="4"/>
    <rect x="152.4" y="294" width="290.8" height="20" rx="4"/>
    <rect x="152.4" y="364" width="257.4" height="20" rx="4"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#172033">
    <text x="899.4" y="145">1973 ms</text>
    <text x="876.9" y="215">1913 ms</text>
    <text x="617.1" y="285">1219 ms</text>
    <text x="490.4" y="355">881 ms</text>
    <text x="592.2" y="169">1153 ms</text>
    <text x="597.8" y="239">1168 ms</text>
    <text x="451.2" y="309">776 ms</text>
    <text x="417.8" y="379">687 ms</text>
  </g>
  <text x="40" y="460" font-family="Arial, sans-serif" font-size="12" fill="#667085">Not: Canlı ağda tekil koşular sağlayıcı gecikmesi nedeniyle değişebilir; sütunlar 5 koşunun medyanıdır.</text>
</svg>
