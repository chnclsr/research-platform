[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "research-platform"
version = "0.21.0"
description = "Local-first, multi-source evidence research platform"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "arq>=0.26,<1",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "greenlet>=3.1,<4",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "mcp>=1.27,<2",
  "minio>=7.2,<8",
  "nvidia-ml-py>=13.610,<14",
  # Exact pin, not a range: this is the smart_router fast path AND the source
  # of every gate.py signal (table/figure/OCR detection). It was never a
  # declared dependency before 2026-08-20 -- installed ad hoc in dev venvs
  # only, absent here, so a real deployment would silently run the whole
  # pipeline on the unmeasured PyMuPDF fallback (inspector.py's
  # PyMuPDFFallback) with no error, just a name change in provenance nobody
  # was watching for. All of today's measurements assume 1.14.1.
  "pdf-inspector==1.14.1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5.1,<7",
  "pymupdf>=1.25,<2",
  "pillow>=10,<12",
  "python-docx>=1.1,<2",
  "psutil>=6.1,<8",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "sse-starlette>=2.2,<4",
  "scrapling[fetchers]>=0.4.6,<0.5",
  "ulid-py>=1.1,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
academic = [
  "paper-qa>=5",
]
# The heavy half of smart_pdf. Declared here rather than in `dependencies` because it
# pulls torch and lands at ~1.4 GB installed, plus ~0.5 GB of layout weights fetched on
# first use -- a cost every install would otherwise pay, including ones that never parse
# a PDF. Optional in packaging only, NOT in effect: without it the router still routes,
# but the pages it routes have nowhere to go. They keep their fast-path text, get marked
# `degraded` in provenance, and a fully scanned PDF is dropped by acquisition's
# 400-character check. Every routing gain measured in previous_reports/PDF_PARSER_V0.1.0_RC1_REPORT.md
# assumes this is installed.
#
# Where it gets installed is an open decision (that report, section N.8): the image does
# not install it today. For local work, an interpreter that has it can be named instead --
# see SMART_ROUTER_DOCLING_PYTHON in .env.example.
parsing = [
  "docling>=2.120,<3",
]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
research-api = "research_platform.api:run"
research-worker = "research_platform.worker:run"
research-mcp = "research_platform.mcp_server:run"
research-telegram = "research_platform.telegram_bot:run"
research-control-panel = "research_platform.control_panel:run"
research-admin = "research_platform.admin_cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/research_platform"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"
