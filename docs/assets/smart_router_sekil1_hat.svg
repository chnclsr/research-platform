<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900" role="img" aria-label="acquisition.py belgeyi ParserRegistry uzerinden SmartPdfParser'a verir; SmartPdfParser icinde once ucuz inspector-gate-critic-selector hatti her sayfayi isaretler, sonra yalniz isaretli sayfalar Docling ve yedekteki MinerU motoruna gider, merge.birlestir() ikisini sayfa sayfa birlestirir, sayfa_basliklariyla ParsedDocument uretir ve acquisition.py content_hash hesaplar; Ayarlar dosyasi esik profilini tum karar noktalarina akitir.">
  <!-- Standalone: butun stiller iceride, CSS degiskeni yok. GitHub SVG'yi <img>
       olarak yukler, disaridan stil gelmez. Fontlar sistem yiginina birakildi. -->
  <style>
    .bg      { fill: #fdfbf6; }
    .n-box   { fill: #f0ebdf; stroke: #57513f; stroke-width: 1; }
    .n-box.accent { stroke: #bf4a19; stroke-width: 1.4; }
    .n-box.dim    { stroke-dasharray: 4 3; opacity: .7; }
    .n-title { font: 600 12.5px -apple-system, "Segoe UI", Roboto, sans-serif; fill: #221f19; }
    .n-sub   { font: 10.5px ui-monospace, Consolas, "Liberation Mono", monospace; fill: #635c4c; }
    .n-sub.accent { fill: #bf4a19; }
    .grp       { fill: none; stroke: #cfc7b4; stroke-dasharray: 3 3; }
    .grp-label { font: 10px ui-monospace, Consolas, monospace; letter-spacing: .05em;
                 text-transform: uppercase; fill: #635c4c; }
    .edge         { stroke: #635c4c; stroke-width: 1.1; fill: none; }
    .edge.accent  { stroke: #bf4a19; stroke-width: 1.4; }
    .edge.dashed  { stroke-dasharray: 4 3; }
    .e-label { font: 10px ui-monospace, Consolas, monospace; fill: #635c4c;
               paint-order: stroke; stroke: #fdfbf6; stroke-width: 3.4px; stroke-linejoin: round; }
    .e-label.accent { fill: #bf4a19; }
  </style>
  <defs>
    <marker id="s1arrM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
