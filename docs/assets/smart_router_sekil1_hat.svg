  <text class="n-sub" x="482" y="616">&#8594; MergedDocument</text>

  <path class="edge" d="M640,632 V664" marker-end="url(#s1arrM)"/>

  <rect class="n-box" x="470" y="668" width="340" height="92" rx="4"/>
  <text class="n-title" x="482" y="692">sayfa_basliklariyla()</text>
