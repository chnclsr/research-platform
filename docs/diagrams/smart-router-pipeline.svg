<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 860" width="1360" height="860">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .card-accent { fill: rgba(235, 108, 54, 0.08); stroke: #eb6c36; stroke-width: 2; }
      .card-success { fill: rgba(5, 150, 105, 0.08); stroke: #059669; stroke-width: 2; }
      .card-purple { fill: rgba(124, 58, 237, 0.08); stroke: #7c3aed; stroke-width: 2; }
      .card-danger { fill: rgba(220, 38, 38, 0.08); stroke: #dc2626; stroke-width: 1.5; }
      .card-strong { fill: #ffffff; stroke: #0f172a; stroke-width: 2; }
      .boundary { fill: none; stroke: #cbd5e1; stroke-dasharray: 6,4; stroke-width: 1.5; }
      .tag-bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .pill-link-bg { fill: rgba(37, 99, 235, 0.08); }
      .pill-success-bg { fill: rgba(5, 150, 105, 0.08); }
      
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 500; font-size: 12px; fill: #475569; }
      .label-code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-weight: 500; font-size: 11px; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; font-size: 11px; fill: #64748b; }
      
      .c-accent { fill: #eb6c36; }
      .c-link { fill: #2563eb; }
      .c-success { fill: #059669; }
      .c-purple { fill: #7c3aed; }
      .c-danger { fill: #dc2626; }
      .c-soft { fill: #64748b; }
      .c-muted { fill: #475569; }
      
      .conn-fast { fill: none; stroke: #059669; stroke-width: 2; }
      .conn-heavy { fill: none; stroke: #7c3aed; stroke-width: 2; }
      .conn-accent { fill: none; stroke: #eb6c36; stroke-width: 2; }
      .conn-soft { fill: none; stroke: #64748b; stroke-width: 1.5; }
      .conn-dash { fill: none; stroke: #059669; stroke-dasharray: 5,4; stroke-width: 2; }
    </style>
    <marker id="arr-rt-fast" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#059669" />
    </marker>
    <marker id="arr-rt-heavy" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#7c3aed" />
    </marker>
    <marker id="arr-rt-accent" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#eb6c36" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="16" />

  <!-- Stage 1 -->
  <rect x="30" y="40" width="260" height="780" rx="16" class="boundary" />
  <rect x="50" y="30" width="180" height="22" rx="6" class="tag-bg" />
  <text x="58" y="45" class="label-badge">1. HIZLI ÇIKARIM &amp; SİNYAL</text>

  <g transform="translate(50, 70)">
    <rect width="220" height="80" rx="12" class="card" />
    <text x="16" y="28" class="label-title">Ham PDF Baytları</text>
    <text x="16" y="48" class="label-sub">PyMuPDF Stream / Memory</text>
    <rect x="16" y="56" width="90" height="16" rx="4" class="pill-link-bg" />
    <text x="20" y="68" class="label-code c-link" font-size="10">content: bytes</text>
  </g>

  <g transform="translate(50, 180)">
    <rect width="220" height="130" rx="12" class="card-success" />
    <text x="16" y="28" class="label-title c-success" font-size="15">pdf-inspector == 1.14.1</text>
    <text x="16" y="48" class="label-sub">2.6 ms/sayfa (Tüm Belge)</text>
    <text x="16" y="68" class="label-code">• Okuma sırası sıralaması</text>
    <text x="16" y="86" class="label-code">• Vektör çizgi / grid tespiti</text>
    <text x="16" y="104" class="label-code">• Görsel / Resim katmanı</text>
  </g>

  <g transform="translate(50, 340)">
    <rect width="220" height="100" rx="12" class="card" />
    <text x="16" y="28" class="label-title" font-size="13">Fast Text Çıktısı</text>
    <text x="16" y="48" class="label-sub" font-size="11">Sayfa sayfa ham metin</text>
    <text x="16" y="66" class="label-code c-soft">dict[int, str] (fast_pages)</text>
    <rect x="16" y="74" width="130" height="16" rx="4" class="pill-success-bg" />
    <text x="20" y="86" class="label-code c-success" font-size="10">%44 Sayfa Burada Biter</text>
  </g>

  <!-- Stage 2 -->
  <rect x="320" y="40" width="300" height="780" rx="16" class="boundary" />
  <rect x="340" y="30" width="220" height="22" rx="6" class="tag-bg" />
  <text x="348" y="45" class="label-badge">2. KARAR KAPISI &amp; ELEŞTİRMEN</text>

  <g transform="translate(340, 70)">
    <rect width="260" height="150" rx="12" class="card-accent" />
    <text x="16" y="28" class="label-title c-accent" font-size="15">GirisKapisi (gate.py)</text>
    <text x="16" y="48" class="label-sub">Sayfa Fiziksel Sinyalleri:</text>
    <text x="16" y="70" class="label-code">• has_table: çizgi &gt; 6, grid</text>
    <text x="16" y="88" class="label-code">• needs_ocr: metin yok + resim</text>
    <text x="16" y="106" class="label-code">• has_figure: vektör/şekil</text>
    <text x="16" y="124" class="label-code c-accent">• kalite_vetosu_cizimsiz</text>
  </g>

  <g transform="translate(340, 240)">
    <rect width="260" height="160" rx="12" class="card" />
    <text x="16" y="28" class="label-title" font-size="15">PDFCritic (critic.py)</text>
    <text x="16" y="48" class="label-sub">Metin Kalite Skoru (0 - 100):</text>
    <text x="16" y="70" class="label-code">• quality_score &lt; 75.0 ?</text>
    <text x="16" y="88" class="label-code">• critical_issues: PUA, CID</text>
    <text x="16" y="106" class="label-code c-muted">• critic_ceza_dokumu</text>
    <text x="16" y="124" class="label-code c-muted">• dangling_sentence cezası</text>
  </g>

  <g transform="translate(340, 420)">
    <rect width="260" height="100" rx="12" class="card" />
    <text x="16" y="28" class="label-title">sayfa_secici (pages.py)</text>
    <text x="16" y="48" class="label-sub">Çağrı Planı &amp; Batching:</text>
    <text x="16" y="68" class="label-code">cagri_plani([1, 2, 5, 6])</text>
    <text x="16" y="86" class="label-code c-soft">Ardışık sayfaları paketler</text>
  </g>

  <!-- Stage 3 -->
  <rect x="650" y="40" width="310" height="780" rx="16" class="boundary" />
  <rect x="670" y="30" width="220" height="22" rx="6" class="tag-bg" />
  <text x="678" y="45" class="label-badge">3. AĞIR MOTOR HATTI (DOCLING)</text>

  <g transform="translate(670, 70)">
    <rect width="270" height="75" rx="12" class="card" stroke="#7c3aed" stroke-width="1.5" />
    <text x="16" y="28" class="label-title c-purple">_AGIR_KAPI (Semaphore)</text>
    <text x="16" y="48" class="label-sub">RAM / GPU Koruması (Aşırı yük engeli)</text>
    <text x="16" y="64" class="label-code c-soft" font-size="10">asyncio.Semaphore(max_parallel)</text>
  </g>

  <g transform="translate(670, 165)">
    <rect width="270" height="150" rx="12" class="card-purple" />
    <text x="16" y="28" class="label-title c-purple" font-size="15">Docling Engine (Ana Ağır Motor)</text>
    <text x="16" y="48" class="label-sub">1.55 s/sayfa | GPU / CPU</text>
    <text x="16" y="70" class="label-code">• Hücre düzeyinde tablo gridi</text>
    <text x="16" y="88" class="label-code">• Yapısal OCR ve Layout</text>
    <text x="16" y="106" class="label-code">• JSON Table &amp; Markdown Pipes</text>
    <text x="16" y="124" class="label-code c-soft">• Multi-column akış birleştirme</text>
  </g>

  <g transform="translate(670, 335)">
    <rect width="270" height="100" rx="12" class="card" />
    <text x="16" y="28" class="label-title">MinerU Engine (Yedek)</text>
    <text x="16" y="48" class="label-sub">Docling Çökmesi / Timeout Durumu</text>
    <text x="16" y="68" class="label-code c-soft">7.66 s/sayfa (CPU/GPU)</text>
    <text x="16" y="86" class="label-code c-soft">Taranmış PDF'lerde 24.5k karakter</text>
  </g>

  <!-- Stage 4 -->
  <rect x="990" y="40" width="340" height="780" rx="16" class="boundary" />
  <rect x="1010" y="30" width="250" height="22" rx="6" class="tag-bg" />
  <text x="1018" y="45" class="label-badge">4. GÜVENLİK, KARANTİNA &amp; MERGE</text>

  <g transform="translate(1010, 70)">
    <rect width="300" height="100" rx="12" class="card" />
    <text x="16" y="28" class="label-title">İçerik Kaybı Denetimi</text>
    <text x="16" y="48" class="label-sub">_icerik_kaybi_var()</text>
    <text x="16" y="68" class="label-code c-danger">len(heavy) &lt; 0.50 * len(fast)?</text>
    <text x="16" y="86" class="label-code c-soft">Kaybolan formül / metin kontrolü</text>
  </g>

  <g transform="translate(1010, 190)">
    <rect width="300" height="120" rx="12" class="card-accent" />
    <text x="16" y="28" class="label-title c-accent">Bozulma Skoru &amp; Tolerans</text>
    <text x="16" y="48" class="label-sub">dead_band = 5.0 (Son Güncelleme)</text>
    <text x="16" y="68" class="label-code">score(heavy) &lt; score(fast) - 5.0?</text>
    <text x="16" y="86" class="label-code c-soft">Font glif bozulması (-20.8) yakalar</text>
    <text x="16" y="104" class="label-code c-success">Hatalı ret oranı: 8'den 1'e düştü</text>
  </g>

  <g transform="translate(1010, 330)">
    <rect width="145" height="80" rx="10" class="card-danger" />
    <text x="12" y="26" class="label-title c-danger" font-size="13">KARANTİNA</text>
    <text x="12" y="44" class="label-sub" font-size="11">Heavy reddedilir</text>
    <text x="12" y="62" class="label-code c-danger" font-size="10">Fast metin kalır</text>

    <g transform="translate(155, 0)">
      <rect width="145" height="80" rx="10" class="card-success" />
      <text x="12" y="26" class="label-title c-success" font-size="13">HEAVY KABUL</text>
      <text x="12" y="44" class="label-sub" font-size="11">Docling onaylandı</text>
      <text x="12" y="62" class="label-code c-success" font-size="10">Tablo &amp; OCR eklenir</text>
    </g>
  </g>

  <g transform="translate(1010, 430)">
    <rect width="300" height="110" rx="12" class="card" />
    <text x="16" y="28" class="label-title">Başlık Normalizasyonu</text>
    <text x="16" y="48" class="label-sub">nest_under_page()</text>
    <text x="16" y="68" class="label-code">• # Page N en tepeye konur</text>
    <text x="16" y="86" class="label-code">• Belge başlıkları ## yapılır</text>
    <text x="16" y="102" class="label-code c-success">• section_path %98 -&gt; %0 kayıp</text>
  </g>

  <g transform="translate(1010, 560)">
    <rect width="300" height="150" rx="12" class="card-strong" />
    <text x="16" y="28" class="label-title" font-size="15">ParsedDocument Çıktısı</text>
    <text x="16" y="48" class="label-sub">Downstream Tüketiciler İçin:</text>
    <text x="16" y="70" class="label-code">• text: Alıntılanabilir Markdown</text>
    <text x="16" y="88" class="label-code">• tables: list[ParsedTable]</text>
    <text x="16" y="106" class="label-code c-muted">• parse_provenance:</text>
    <text x="24" y="122" class="label-code c-soft" font-size="10">engine_pages, profile, scores</text>
    <text x="16" y="138" class="label-code c-muted">• page_count: int</text>
  </g>

  <!-- Connectors -->
  <path d="M 270,245 H 340" class="conn-fast" marker-end="url(#arr-rt-fast)" />
  <path d="M 270,110 H 300 V 245" class="conn-soft" />
  <path d="M 470,220 V 240" class="conn-accent" marker-end="url(#arr-rt-accent)" />
  <path d="M 470,400 V 420" class="conn-accent" marker-end="url(#arr-rt-accent)" />
  <path d="M 600,470 H 635 V 240 H 670" class="conn-heavy" marker-end="url(#arr-rt-heavy)" />
  <path d="M 470,520 V 740 H 970 V 635 H 1010" class="conn-dash" marker-end="url(#arr-rt-fast)" />
  <path d="M 940,240 H 1010" class="conn-heavy" marker-end="url(#arr-rt-heavy)" />
</svg>
