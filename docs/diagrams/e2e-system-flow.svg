<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 920" width="1660" height="920">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .card-accent { fill: rgba(235, 108, 54, 0.08); stroke: #eb6c36; stroke-width: 2; }
      .card-success { fill: rgba(5, 150, 105, 0.08); stroke: #059669; stroke-width: 2; }
      .card-purple { fill: rgba(124, 58, 237, 0.08); stroke: #7c3aed; stroke-width: 2; }
      .card-strong { fill: #ffffff; stroke: #475569; stroke-width: 2; }
      .boundary { fill: none; stroke: #cbd5e1; stroke-dasharray: 6,4; stroke-width: 1.5; }
      .tag-bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .pill-accent-bg { fill: rgba(235, 108, 54, 0.08); }
      
      .label-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .label-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 500; font-size: 11px; fill: #475569; }
      .label-code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-weight: 500; font-size: 10px; fill: #0f172a; }
      .label-badge { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; font-size: 11px; fill: #64748b; }
      
      .c-accent { fill: #eb6c36; }
      .c-link { fill: #2563eb; }
      .c-success { fill: #059669; }
      .c-purple { fill: #7c3aed; }
      .c-danger { fill: #dc2626; }
      .c-muted { fill: #475569; }
      .c-soft { fill: #64748b; }
      
      .conn-blue { fill: none; stroke: #2563eb; stroke-width: 2; }
      .conn-accent { fill: none; stroke: #eb6c36; stroke-width: 2; }
      .conn-purple { fill: none; stroke: #7c3aed; stroke-width: 2; }
      .conn-green { fill: none; stroke: #059669; stroke-width: 2; }
      .conn-ink { fill: none; stroke: #0f172a; stroke-width: 1.5; }
      .conn-delivery { fill: none; stroke: #2563eb; stroke-dasharray: 6,4; stroke-width: 2; }
    </style>
    <marker id="m-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#2563eb" />
    </marker>
    <marker id="m-accent" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#eb6c36" />
    </marker>
    <marker id="m-purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#7c3aed" />
    </marker>
    <marker id="m-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#059669" />
    </marker>
    <marker id="m-ink" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#0f172a" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" rx="16" />

  <!-- SÜTUN 1: KULLANICI & GİRİŞLER -->
  <rect x="40" y="40" width="220" height="720" rx="16" class="boundary" />
  <rect x="55" y="28" width="170" height="24" rx="6" class="tag-bg" />
  <text x="63" y="44" class="label-badge">1. KULLANICI &amp; GİRİŞ</text>

  <!-- 1.1 Kullanıcı Aktörü -->
  <g transform="translate(50, 65)">
    <rect width="200" height="75" rx="12" class="card-accent" />
    <text x="16" y="26" class="label-title c-accent">Kullanıcı / Araştırmacı</text>
    <text x="16" y="44" class="label-sub">Soru &amp; Araştırma Talebi</text>
    <text x="16" y="60" class="label-code c-accent">"Sağlıkta YZ Durumu"</text>
  </g>

  <!-- 1.2 Telegram Bot -->
  <g transform="translate(50, 175)">
    <rect width="200" height="85" rx="12" class="card" />
    <text x="16" y="26" class="label-title">Telegram Bot</text>
    <text x="16" y="44" class="label-sub">telegram_bot.py</text>
    <text x="16" y="60" class="label-code c-soft">• Soru girişi &amp; HITL butonu</text>
    <text x="16" y="74" class="label-code c-link">• Canlı ilerleme &amp; .docx</text>
  </g>

  <!-- 1.3 Control Panel UI -->
  <g transform="translate(50, 285)">
    <rect width="200" height="85" rx="12" class="card" />
    <text x="16" y="26" class="label-title">Control Panel UI</text>
    <text x="16" y="44" class="label-sub">control_panel.py</text>
    <text x="16" y="60" class="label-code c-soft">• Web Dashboard &amp; Ayarlar</text>
    <text x="16" y="74" class="label-code c-purple">• Canlı SSE Olay Akışı</text>
  </g>

  <!-- 1.4 Admin CLI & REST API -->
  <g transform="translate(50, 395)">
    <rect width="200" height="75" rx="12" class="card" />
    <text x="16" y="26" class="label-title">Admin CLI &amp; REST API</text>
    <text x="16" y="44" class="label-sub">admin_cli.py / api.py</text>
    <text x="16" y="62" class="label-code c-accent">POST /api/v1/research/start</text>
  </g>

  <!-- SÜTUN 2: ORKESTRASYON & LANGGRAPH -->
  <rect x="295" y="40" width="290" height="720" rx="16" class="boundary" />
  <rect x="310" y="28" width="220" height="24" rx="6" class="tag-bg" />
  <text x="318" y="44" class="label-badge">2. AGENT CORE (LANGGRAPH)</text>

  <!-- 2.1 PLAN & DECOMPOSE -->
  <g transform="translate(310, 65)">
    <rect width="260" height="80" rx="12" class="card" />
    <text x="16" y="26" class="label-title">1. PLAN &amp; DECOMPOSE</text>
    <text x="16" y="44" class="label-sub">Soru Ayrıştırma &amp; Protokol</text>
    <rect x="16" y="52" width="125" height="18" rx="4" class="pill-accent-bg" />
    <text x="22" y="65" class="label-code c-accent">HITL Plan Onayı Bekler</text>
  </g>

  <!-- 2.2 BUILD BRANCHES & SEARCH -->
  <g transform="translate(310, 175)">
    <rect width="260" height="80" rx="12" class="card" />
    <text x="16" y="26" class="label-title">2. BUILD BRANCHES &amp; SEARCH</text>
    <text x="16" y="44" class="label-sub">Akademik / Web Arama</text>
    <text x="16" y="62" class="label-code c-soft">PubMed, arXiv, Semantic, Google</text>
  </g>

  <!-- 2.3 ACQUIRE -->
  <g transform="translate(310, 285)">
    <rect width="260" height="95" rx="12" class="card-accent" />
    <text x="16" y="26" class="label-title c-accent" font-size="15">3. ACQUIRE (İndirme &amp; Parse)</text>
    <text x="16" y="46" class="label-sub">AcquisitionService._direct()</text>
    <text x="16" y="64" class="label-code">• ParserRegistry.select("pdf")</text>
    <text x="16" y="80" class="label-code">• SmartPdfParser (Priority: 20)</text>
  </g>

  <!-- 2.4 NORMALIZE & CHUNK_INDEX -->
  <g transform="translate(310, 410)">
    <rect width="260" height="85" rx="12" class="card" />
    <text x="16" y="26" class="label-title">4. NORMALIZE &amp; CHUNK_INDEX</text>
    <text x="16" y="44" class="label-sub">passages.py (chunk_document)</text>
    <text x="16" y="62" class="label-code c-success"># Page N | Vektör Embedding</text>
  </g>

  <!-- 2.5 EXTRACT & ANALYZE -->
  <g transform="translate(310, 525)">
    <rect width="260" height="85" rx="12" class="card" />
    <text x="16" y="26" class="label-title">5. EXTRACT &amp; ANALYZE</text>
    <text x="16" y="44" class="label-sub">Kanıt Çıkarma &amp; İddia Analizi</text>
    <text x="16" y="62" class="label-code c-soft">• AUDIT &amp; CHECK_COVERAGE</text>
  </g>

  <!-- 2.6 SYNTHESIZE & EXPORT -->
  <g transform="translate(310, 640)">
    <rect width="260" height="85" rx="12" class="card" />
    <text x="16" y="26" class="label-title">6. SYNTHESIZE &amp; EXPORT</text>
    <text x="16" y="44" class="label-sub">LLM Sentezi &amp; Doküman Üretimi</text>
    <text x="16" y="62" class="label-code c-link">• Word (.docx), Markdown, PDF</text>
  </g>

  <!-- SÜTUN 3: PARSER REGISTRY & SMART ROUTER -->
  <rect x="625" y="40" width="350" height="720" rx="16" class="boundary" />
  <rect x="640" y="28" width="270" height="24" rx="6" class="tag-bg" />
  <text x="648" y="44" class="label-badge">3. PARSER REGISTRY &amp; SMART ROUTER</text>

  <!-- 3.1 Registry -->
  <g transform="translate(640, 65)">
    <rect width="320" height="80" rx="12" class="card" />
    <text x="16" y="26" class="label-title">ParserRegistry.select("pdf")</text>
    <text x="16" y="44" class="label-sub">Öncelik Tabanlı Seçim Motoru:</text>
    <text x="16" y="62" class="label-code c-accent">1. SmartPdfParser (Öncelik: 20)</text>
  </g>

  <!-- 3.2 Fast Path -->
  <g transform="translate(640, 175)">
    <rect width="320" height="90" rx="12" class="card-success" />
    <text x="16" y="26" class="label-title c-success">Fast Path: pdf-inspector (1.14.1)</text>
    <text x="16" y="44" class="label-sub">2.6 ms/sayfa Hızlı Ön Tarama (Tüm Belge)</text>
    <text x="16" y="62" class="label-code">• Okuma sırası &amp; Vektör çizgi tespiti</text>
    <text x="16" y="78" class="label-code">• Görsel / Resim katmanı analizi</text>
  </g>

  <!-- 3.3 Gate & Critic -->
  <g transform="translate(640, 295)">
    <rect width="320" height="100" rx="12" class="card" stroke="#eb6c36" stroke-width="1.5" />
    <text x="16" y="26" class="label-title c-accent">gate.py &amp; critic.py (Karar Kapısı)</text>
    <text x="16" y="44" class="label-sub">Sayfa Bazlı İnceleme &amp; Skorlama:</text>
    <text x="16" y="62" class="label-code">• has_table, needs_ocr, has_figure</text>
    <text x="16" y="78" class="label-code c-accent">• kalite_vetosu_cizimsiz (İsraf Önleyici)</text>
  </g>

  <!-- 3.4 Docling Engine -->
  <g transform="translate(640, 425)">
    <rect width="320" height="100" rx="12" class="card-purple" />
    <text x="16" y="26" class="label-title c-purple">Docling Engine (_AGIR_KAPI Semaphore)</text>
    <text x="16" y="44" class="label-sub">1.55 sn/sayfa | Yalnızca Seçilen Sayfalar</text>
    <text x="16" y="62" class="label-code">• Hücre düzeyinde tablo gridi &amp; Markdown</text>
    <text x="16" y="78" class="label-code">• Yapısal OCR ve Layout Modellemesi</text>
  </g>

  <!-- 3.5 Merge & Quarantine -->
  <g transform="translate(640, 555)">
    <rect width="320" height="100" rx="12" class="card-strong" />
    <text x="16" y="26" class="label-title">merge.py (Karantina &amp; Birlestir)</text>
    <text x="16" y="44" class="label-sub">Doğrulama &amp; Başlık Hiyerarşisi:</text>
    <text x="16" y="62" class="label-code c-danger">• Kayıp &gt; %50 veya Bozulma &gt; 5.0?</text>
    <text x="16" y="78" class="label-code c-success">• nest_under_page(): # Page N + ## Bölüm</text>
  </g>

  <!-- SÜTUN 4: KALICI VERİTABANI & DEPOLAMA -->
  <rect x="1025" y="40" width="575" height="720" rx="16" class="boundary" />
  <rect x="1040" y="28" width="280" height="24" rx="6" class="tag-bg" />
  <text x="1048" y="44" class="label-badge">4. KALICI VERİTABANI &amp; NESNE DEPOLAMA</text>

  <!-- 4.1 research_runs -->
  <g transform="translate(1040, 65)">
    <rect width="540" height="80" rx="12" class="card" stroke="#7c3aed" stroke-width="1.5" />
    <text x="16" y="26" class="label-title c-purple">PostgreSQL: research_runs Tablosu</text>
    <text x="16" y="44" class="label-sub">Koşu Kimliği &amp; LangGraph Durumları</text>
    <text x="16" y="62" class="label-code">• run_id (ULID), status, protocol, hitl_history, budget</text>
  </g>

  <!-- 4.2 sources -->
  <g transform="translate(1040, 175)">
    <rect width="540" height="90" rx="12" class="card" stroke="#7c3aed" stroke-width="1.5" />
    <text x="16" y="26" class="label-title c-purple">PostgreSQL: sources Tablosu</text>
    <text x="16" y="44" class="label-sub">İndirilen ve Ayrıştırılan Kaynaklar</text>
    <text x="16" y="62" class="label-code">• url, content_hash (SHA-256), parser_id="smart_pdf"</text>
    <text x="16" y="78" class="label-code c-accent">• parse_provenance (JSONB), status="open"|"restricted"</text>
  </g>

  <!-- 4.3 MinIO S3 Snapshot Store -->
  <g transform="translate(1040, 295)">
    <rect width="540" height="95" rx="12" class="card" stroke="#2563eb" stroke-width="1.5" />
    <text x="16" y="26" class="label-title c-link">MinIO S3 Snapshot BLOB Store</text>
    <text x="16" y="44" class="label-sub">Ham Doküman ve Görsel Deposu</text>
    <text x="16" y="62" class="label-code">• raw_content: Ham PDF Baytları (Base64) &amp; Figürler</text>
    <text x="16" y="78" class="label-code c-link">• Nihai Word (.docx) rapor dosyaları</text>
  </g>

  <!-- 4.4 passages + Qdrant -->
  <g transform="translate(1040, 425)">
    <rect width="540" height="95" rx="12" class="card" stroke="#059669" stroke-width="1.5" />
    <text x="16" y="26" class="label-title c-success">PostgreSQL: passages + Vektör DB (Qdrant)</text>
    <text x="16" y="44" class="label-sub">Alıntılanabilir Metin Pasajları &amp; Vektörler</text>
    <text x="16" y="62" class="label-code">• passage_id, source_id, text, token_count</text>
    <text x="16" y="78" class="label-code c-success">• section_path="3 Yöntem &gt; Page 5" | dense_vector [1536f]</text>
  </g>

  <!-- 4.5 evidences & reports -->
  <g transform="translate(1040, 555)">
    <rect width="540" height="95" rx="12" class="card" stroke="#7c3aed" stroke-width="1.5" />
    <text x="16" y="26" class="label-title c-purple">PostgreSQL: evidences &amp; reports Tablosu</text>
    <text x="16" y="44" class="label-sub">Kanıtlar, İddialar ve Sentez Raporları</text>
    <text x="16" y="62" class="label-code">• claim_text, confidence_score, contradiction</text>
    <text x="16" y="78" class="label-code c-purple">• synthesis_markdown, citations_json, token_cost</text>
  </g>

  <!-- BAĞLANTI OKLARI -->
  <path d="M 150,140 V 175" class="conn-accent" stroke-width="1.5" marker-end="url(#m-accent)" />

  <path d="M 250,217 H 280 Q 285,217 285,210 V 110 Q 285,105 295,105 H 310" class="conn-blue" marker-end="url(#m-blue)" />
  <g transform="translate(255, 145)">
    <rect width="60" height="20" rx="4" class="tag-bg" stroke="#2563eb" />
    <text x="30" y="14" class="label-badge c-link" font-size="9" text-anchor="middle">Soru</text>
  </g>

  <path d="M 440,145 V 175" class="conn-ink" marker-end="url(#m-ink)" />
  <path d="M 440,255 V 285" class="conn-ink" stroke-width="2" marker-end="url(#m-accent)" />
  <path d="M 440,380 V 410" class="conn-ink" marker-end="url(#m-ink)" />
  <path d="M 440,495 V 525" class="conn-ink" marker-end="url(#m-ink)" />
  <path d="M 440,610 V 640" class="conn-ink" marker-end="url(#m-ink)" />

  <path d="M 570,332 H 605 Q 610,332 610,325 V 110 Q 610,105 620,105 H 640" class="conn-accent" marker-end="url(#m-accent)" />
  <g transform="translate(585, 200)">
    <rect width="50" height="20" rx="4" class="tag-bg" stroke="#eb6c36" />
    <text x="25" y="14" class="label-badge c-accent" font-size="9" text-anchor="middle">PDF</text>
  </g>

  <path d="M 800,145 V 175" class="conn-accent" stroke-width="1.5" marker-end="url(#m-accent)" />
  <path d="M 800,265 V 295" class="conn-green" stroke-width="1.5" marker-end="url(#m-green)" />
  <path d="M 800,395 V 425" class="conn-purple" stroke-width="1.5" marker-end="url(#m-purple)" />
  <path d="M 800,525 V 555" class="conn-ink" marker-end="url(#m-ink)" />

  <path d="M 640,605 H 600 Q 590,605 590,595 V 460 Q 590,452 580,452 H 570" class="conn-green" marker-end="url(#m-green)" />
  <g transform="translate(545, 520)">
    <rect width="90" height="20" rx="4" class="tag-bg" stroke="#059669" />
    <text x="45" y="14" class="label-badge c-success" font-size="9" text-anchor="middle">ParsedDoc</text>
  </g>

  <path d="M 960,220 H 1040" class="conn-purple" marker-end="url(#m-purple)" />
  <path d="M 960,342 H 1040" class="conn-blue" marker-end="url(#m-blue)" />
  <path d="M 960,472 H 1040" class="conn-green" marker-end="url(#m-green)" />
  <path d="M 960,602 H 1040" class="conn-purple" marker-end="url(#m-purple)" />

  <path d="M 570,85 H 600 Q 605,85 605,75 V 50 Q 605,45 615,45 H 1030 Q 1040,45 1040,55 V 65" class="conn-purple" stroke-width="1.5" marker-end="url(#m-purple)" />

  <path d="M 310,682 H 280 Q 275,682 275,690 V 820 Q 275,830 265,830 H 25 Q 15,830 15,820 V 225 Q 15,217 25,217 H 50" class="conn-delivery" marker-end="url(#m-blue)" />
  <g transform="translate(60, 818)">
    <rect width="140" height="22" rx="4" class="tag-bg" stroke="#2563eb" />
    <text x="70" y="15" class="label-badge c-link" font-size="10" text-anchor="middle">Rapor &amp; .docx Teslimi</text>
  </g>
</svg>
