<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rp-architecture-dark-title rp-architecture-dark-desc">
        <title id="rp-architecture-dark-title">Current Research Platform system architecture</title>
        <desc id="rp-architecture-dark-desc">Agent clients, Telegram, and operator surfaces reach the owner-scoped Research API through authenticated gateways. The API places jobs in Redis urgent and normal priorities. A capacity-gated worker runs research jobs concurrently and uses PostgreSQL, MinIO, acquisition services, the standalone Docling GPU service, and Ollama on the host. Model calls are serialized process-wide.</desc>
