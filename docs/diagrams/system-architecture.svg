<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rp-architecture-dark-title rp-architecture-dark-desc">
  <title id="rp-architecture-dark-title">Research Platform system architecture</title>
  <desc id="rp-architecture-dark-desc">Agent clients and Telegram reach the Research API through the MCP and bot gateways with a personal API key; the API enqueues the job on Redis, and the worker drives PostgreSQL, MinIO, the collection services and Ollama on the host; the control panel also reads the database directly, bypassing the API.</desc>
