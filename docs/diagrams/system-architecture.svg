            .bg,.mask{fill:#1b242c}.zone{fill:rgba(242,245,247,.03);stroke:rgba(242,245,247,.12);stroke-width:.8}.zone-label{fill:rgba(242,245,247,.42);font:500 7px 'Geist Mono',monospace;letter-spacing:.14em}.flow{fill:none;stroke:#a9bcc7;stroke-width:1.2}.flow-link{fill:none;stroke:#8ec6de;stroke-width:1.2}.flow-dash{fill:none;stroke:#a9bcc7;stroke-width:1;stroke-dasharray:4 3}.node-external{fill:rgba(242,245,247,.03);stroke:rgba(169,188,199,.25)}.node-service{fill:#26323c;stroke:#f2f5f7}.node-store{fill:rgba(242,245,247,.05);stroke:#a9bcc7}.node-focus{fill:rgba(43,179,216,.14);stroke:#2bb3d8}.node-external,.node-service,.node-store,.node-focus{stroke-width:1}.tag{fill:none;stroke-width:.8}.tag-external{stroke:rgba(169,188,199,.38)}.tag-service{stroke:rgba(242,245,247,.4)}.tag-store{stroke:rgba(169,188,199,.5)}.tag-focus{stroke:rgba(43,179,216,.55)}.tag-text{font:500 7px 'Geist Mono',monospace;letter-spacing:.08em}.soft{fill:#7d94a1}.ink{fill:#f2f5f7}.accent{fill:#2bb3d8}.node-name{fill:#f2f5f7;font:600 12px 'Raleway',sans-serif}.meta{fill:#a9bcc7;font:400 9px 'Geist Mono',monospace}.flow-label{fill:#a9bcc7;font:500 8px 'Geist Mono',monospace;letter-spacing:.06em}.flow-label-link{fill:#8ec6de;font:500 8px 'Geist Mono',monospace;letter-spacing:.06em}.focus-number{fill:rgba(43,179,216,.38);font:600 18px 'Geist Mono',monospace}.callout{fill:#a9bcc7;font:italic 14px 'Instrument Serif',serif}.legend-label{fill:#a9bcc7;font:500 8.5px 'Raleway',sans-serif}
