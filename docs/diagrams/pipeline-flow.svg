  <title id="rp-pipeline-flow-dark-title">ResearchPipeline research flow</title>
  <desc id="rp-pipeline-flow-dark-desc">The LangGraph flow descends from planning through search, acquisition, normalization, passage indexing, evidence extraction and audit; the CHECK_COVERAGE decision routes a sufficient run to adversarial review and export, and an insufficient one back into a new search round through PLAN_RECOVERY.</desc>
